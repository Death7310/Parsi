<title>Khalij Farsi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&family=Young+Serif&family=Figtree:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: app shell — side rail on desktop, bottom tab bar on phone; one view at a time, routed by #hash.
   Palette: Persian Gulf water, henna red and gold from Hormozgan embroidery, over a cool sea-salt ground. */
:root{
  --bg:#eef3f1; --surface:#ffffff; --sunk:#e1eae7; --ink:#13221f; --muted:#56706a; --line:#c9d8d3;
  --accent:#0e7c74; --accent-ink:#ffffff; --henna:#b23a2a; --gold:#a97c12; --good:#1f7a3a; --bad:#b23a2a;
  --f-display:"Young Serif",Georgia,serif; --f-body:"Figtree",system-ui,sans-serif;
  --f-fa:"Vazirmatn","Noto Naskh Arabic",Tahoma,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1615; --surface:#13201f; --sunk:#0f1b1a; --ink:#e2ece9; --muted:#8ea8a2; --line:#24403c;
  --accent:#3dbfb1; --accent-ink:#06201d; --henna:#e0705f; --gold:#e0b44c; --good:#5cc27a; --bad:#e0705f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1615; --surface:#13201f; --sunk:#0f1b1a; --ink:#e2ece9; --muted:#8ea8a2; --line:#24403c;
  --accent:#3dbfb1; --accent-ink:#06201d; --henna:#e0705f; --gold:#e0b44c; --good:#5cc27a; --bad:#e0705f; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
.shell{display:grid;grid-template-columns:200px 1fr;min-height:100%}
nav.rail{position:sticky;top:0;height:100vh;padding:24px 12px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;background:var(--surface)}
.brand{font-family:var(--f-display);font-size:22px;padding:0 10px 4px}
.brand-fa{font-family:var(--f-fa);color:var(--accent);font-size:15px;padding:0 10px 18px}
nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-weight:600;font-size:15px}
nav a .fa{font-family:var(--f-fa);font-weight:400;color:var(--muted);margin-left:auto;font-size:14px}
nav a[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
nav a[aria-current="page"] .fa{color:var(--accent-ink)}
nav a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.sync{margin-top:auto;font-size:12px;color:var(--muted);padding:0 10px}
main{padding-block:28px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.view{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1{font-family:var(--f-display);font-weight:400;font-size:32px;line-height:1.15;margin:0;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:400;font-size:22px;margin:0;text-wrap:balance}
h3{font-size:15px;margin:0;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
p{margin:0;max-width:65ch}
.lede{color:var(--muted);font-size:17px}
.fa{font-family:var(--f-fa)}
.tr{font-family:var(--f-mono);font-size:.92em;color:var(--accent)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
button,.btn{font:600 15px var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 16px;border-radius:8px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px;min-height:44px}
button.primary,.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.bad{border-color:var(--bad);color:var(--bad)}
button.good{border-color:var(--good);color:var(--good)}
button:disabled{opacity:.45;cursor:default}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.chip.ok{color:var(--good)} .chip.warn{color:var(--gold)}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--f-display);font-weight:400;font-size:30px;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.strands{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.strand{border-left:4px solid var(--accent);padding:4px 0 4px 12px;display:flex;flex-direction:column;gap:4px}
.strand:nth-child(2){border-color:var(--henna)} .strand:nth-child(3){border-color:var(--gold)} .strand:nth-child(4){border-color:var(--muted)}
.strand a{color:var(--ink);font-weight:700}
/* flashcard */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px 20px;min-height:280px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
.card .big-fa{font-family:var(--f-fa);font-size:clamp(30px,8vw,46px);font-weight:600;line-height:1.5}
.card .pic{font-size:72px;line-height:1}
.card .en{font-size:20px;font-weight:600}
.card .note{font-size:14px;color:var(--muted);max-width:46ch}
.prog{height:6px;background:var(--sunk);border-radius:6px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);transition:width .3s}
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
/* letters */
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px;direction:rtl}
.lgrid button{font-family:var(--f-fa);font-size:28px;justify-content:center;padding:6px;min-height:64px;flex-direction:column;gap:0}
.lgrid button small{font-family:var(--f-body);font-size:11px;color:var(--muted);direction:ltr}
.lgrid button.done{border-color:var(--accent)}
.forms{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;direction:rtl;text-align:center}
.forms div{background:var(--sunk);border-radius:8px;padding:8px 4px}
.forms .g{font-family:var(--f-fa);font-size:34px;line-height:1.6}
.forms small{display:block;font-size:11px;color:var(--muted);direction:ltr}
.trace{position:relative;width:100%;max-width:420px;aspect-ratio:1;border:1px dashed var(--line);border-radius:12px;background:var(--sunk);touch-action:none;margin:0 auto}
.trace canvas{position:absolute;inset:0;width:100%;height:100%}
/* typing */
.line{font-family:var(--f-fa);font-size:clamp(26px,6vw,38px);direction:rtl;background:var(--sunk);border-radius:12px;padding:16px;line-height:1.9;letter-spacing:.06em;word-break:break-word;min-height:96px}
.line span.ok{color:var(--good)} .line span.cur{background:var(--gold);color:#13221f;border-radius:4px} .line span.err{color:var(--bad);text-decoration:underline}
.kb{display:flex;flex-direction:column;gap:5px;overflow-x:auto;padding-bottom:4px}
.kr{display:flex;gap:5px}
.kr:nth-child(2){padding-left:18px} .kr:nth-child(3){padding-left:36px}
.k{flex:0 0 auto;width:min(46px,calc((100vw - 92px)/12));height:52px;border:1px solid var(--line);border-radius:7px;background:var(--surface);display:flex;flex-direction:column;justify-content:space-between;padding:3px 5px}
.k .lat{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.k .per{font-family:var(--f-fa);font-size:20px;text-align:right;line-height:1}
.k.hot{background:var(--gold);border-color:var(--gold)} .k.hot .per,.k.hot .lat{color:#13221f}
.k.home{border-bottom:3px solid var(--accent)}
.capture{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
/* forms */
label{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:600}
input[type=text],textarea,select{font:16px var(--f-body);padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
input.fa-in{font-family:var(--f-fa);direction:rtl;font-size:20px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.entry{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:4px}
.entry .fa{font-size:22px;direction:rtl;text-align:right}
.refs{font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:6px;padding-left:18px;margin:0}
.claim{display:grid;grid-template-columns:150px 1fr;gap:6px 16px;border-top:1px solid var(--line);padding-top:12px}
.claim b{font-size:14px}
.claim p{font-size:15px}
.claim cite{font-style:normal;color:var(--muted);font-size:13px;display:block;margin-top:2px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;font-size:14px;z-index:20}
@media (max-width:760px){
  .shell{grid-template-columns:1fr}
  nav.rail{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;justify-content:space-around;padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));border-right:0;border-top:1px solid var(--line);z-index:10;gap:2px}
  .brand,.brand-fa,.sync,nav a.desk{display:none}
  nav a{flex-direction:column;gap:0;font-size:11px;padding:6px 4px;flex:1;justify-content:center;text-align:center}
  nav a .fa{margin:0;font-size:15px;order:-1}
  h1{font-size:27px}
  .strands,.fgrid{grid-template-columns:1fr}
  .claim{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

    <a href="#south">South <span class="fa">جنوب</span></a>

    <div class="sync" id="sync">Saving on this device</div>
  </nav>
  <main id="main"></main>
</div>
<div class="toast" id="toast" hidden></div>

 {id:"c30",set:"Bye",fa:"خداحافظ",tr:"khodâhâfez",en:"Goodbye",note:"Literally 'God keep you'."},
 {id:"c31",set:"Bye",fa:"فعلاً",tr:"fe'lan",en:"See you (casual)",note:"Literally 'for now'."},

 {id:"c38",set:"Getting around",fa:"اینجا کجاست؟",tr:"injâ kojâst?",en:"Where are we?",note:"Literally 'where is here?'"},
 {id:"c39",set:"Getting around",fa:"گم شدم.",tr:"gom shodam.",en:"I'm lost.",note:""},
 {id:"c40",set:"Getting around",fa:"میشه کمکم کنید؟",tr:"mishe komakam konid?",en:"Can you help me?",note:"mishe ... = can you / is it possible."},
 {id:"c41",set:"Getting around",fa:"چقدر میشه؟",tr:"cheghadr mishe?",en:"How much does it come to?",note:"Ask this at the till."},

async function connect(){
  if(!window.claude?.use) return;
  try{
    const [d,u] = await Promise.all([claude.use("db"), claude.use("user")]);
    if(!d || !u) return;
    const id = await u.id(); if(!id) return;
    db = d; uid = id;
    claude.use("assets").then(a=>{ assets=a; if(route()==="south") render(); }).catch(()=>{});
    const snap = await db.doc(`data/users/${uid}/state/progress`).get();
    if(snap.exists){
      const remote = JSON.parse(snap.data().json || "{}");
      // Keep whichever copy has seen more reviews; merge card-by-card on box.
      for(const [k,c] of Object.entries(remote.cards||{})){ const l=S.cards[k]; if(!l || (c.s||0)>(l.s||0)) S.cards[k]=c; }
      for(const key of ["intro","typing","traced"]) S[key] = Object.assign({}, remote[key]||{}, S[key]);
      if((remote.streak?.last||0) > S.streak.last) S.streak = remote.streak;
      if((remote.input||[]).length > S.input.length) S.input = remote.input;
      for(const key of ["cats","target","showAr"]) if(remote[key]!==undefined) S[key]=remote[key];
    }
    save();
    db.collection(`data/users/${uid}/notebook`).onSnapshot(qs=>{
      notebook = qs.docs.map(d=>Object.assign({id:d.id}, d.data())).sort((a,b)=>(b.created||0)-(a.created||0));
      saveNotebookLocal();
      if(route()==="south" || route()==="today") render();
    },()=>{});
    syncEl().textContent = "Synced to your account, so phone and computer share progress";
    render();
  }catch(e){}
}

/* ---------- speech ---------- */
// Recorded audio (tutor recordings first, then synthetic voices) from audio/manifest.json; device speech is the fallback.
let AUDIO = {}, AUDIO_BY_FA = {};
const cleanFa = t => t.replace(/\s*\.\.\.\s*/g," ").replace(/\s*\/\s*/g,"، ").replace(/\s*ـه/g,"").trim();
fetch("audio/manifest.json").then(r=>r.ok?r.json():{}).then(m=>{
  AUDIO = m || {}; for(const [k,v] of Object.entries(AUDIO)) AUDIO_BY_FA[k.split("|")[0]] ??= v;
  if(route()==="today") render();
}).catch(()=>{});
function clipFor(text, tr){
  const t = cleanFa(text), e = tr ? AUDIO[t+"|"+tr] : AUDIO_BY_FA[t];   // a known reading must match exactly: کی is ki or key
  if(!e) return null;
  const pool = e.tutor.length ? e.tutor : e.tts;   // rotate speakers: hearing several voices trains the ear better than one
  return pool[Math.floor(Math.random()*pool.length)];
}
let nowPlaying = null;
let faVoice = null;
function pickVoice(){ const v = speechSynthesis.getVoices(); faVoice = v.find(x=>/^fa/i.test(x.lang)) || null; }
if("speechSynthesis" in window){ pickVoice(); speechSynthesis.onvoiceschanged = ()=>{ pickVoice(); if(route()==="today") render(); }; }
const nativeTTS = () => window.Capacitor?.Plugins?.TextToSpeech || null;
function speak(text, rate=0.8, tr, then){
  const src = clipFor(text, tr);
  if(src){
    nowPlaying?.pause();
    const a = nowPlaying = new Audio(src); a.playbackRate = rate < 0.7 ? 0.75 : 1;
    if(then) a.onended = then;
    a.play().catch(()=>deviceSpeak(text, rate));
    return;
  }
  deviceSpeak(text, rate);
  if(then) setTimeout(then, 400 + text.length * 90);
}
function speakSeq(list, rate){ const [first,...rest] = list; if(first) speak(first[0], rate, first[1], rest.length ? ()=>speakSeq(rest, rate) : null); }
const canRecord = () => !!(window.Capacitor && navigator.mediaDevices?.getUserMedia && window.MediaRecorder);
function recorderButtons(){
  let rec = null, url = null;
  const mine = h("button",{disabled:true,onclick:()=>url && new Audio(url).play()},"Play mine");
  const btn = h("button",{onclick:async()=>{
    if(rec && rec.state==="recording"){ rec.stop(); return; }
    try{
      const stream = await navigator.mediaDevices.getUserMedia({audio:true}); const parts = [];
      rec = new MediaRecorder(stream);
      rec.ondataavailable = e => parts.push(e.data);
      rec.onstop = () => { stream.getTracks().forEach(t=>t.stop()); url = URL.createObjectURL(new Blob(parts,{type:rec.mimeType})); mine.disabled = false; btn.textContent = "Record again"; };
      rec.start(); btn.textContent = "Stop"; setTimeout(()=>rec.state==="recording" && rec.stop(), 8000);
    }catch(e){ toast("Allow microphone access to record yourself"); }
  }},"Record me");
  return [btn, mine];
}
function deviceSpeak(text, rate=0.8){
  const T = nativeTTS();
  if(T){ T.speak({text:text.replace(/\.\.\./g,"").replace(/___/g,""),lang:"fa-IR",rate}).catch(()=>toast("Install a Persian voice in Android text-to-speech settings")); return; }
  if(!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text.replace(/\.\.\./g,"").replace(/___/g,"")); u.lang="fa-IR"; u.rate=rate; if(faVoice) u.voice=faVoice;
  speechSynthesis.speak(u);
}

const $ = (s,el=document)=>el.querySelector(s);
const h = (tag, attrs={}, ...kids)=>{ const el=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){ if(k==="class") el.className=v; else if(k.startsWith("on")) el.addEventListener(k.slice(2),v); else if(v!==false && v!=null) el.setAttribute(k,v===true?"":v); }
  for(const kid of kids.flat()){ if(kid==null||kid===false) continue; el.append(kid.nodeType?kid:document.createTextNode(String(kid))); }
  return el; };
const put = (el,...kids) => el.append(...kids.filter(k=>k!=null&&k!==false));

const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
function bumpStreak(){ const d=today(); if(S.streak.last===d) return; S.streak.n = (S.streak.last===d-1) ? S.streak.n+1 : 1; S.streak.last=d; }

function allCards(){
  const c = CHUNKS.map(x=>({...x,kind:"chunk"}));
  const w = WORDS.map(x=>({...x,kind:"word",ex:{fa:x.s,tr:x.st,en:`This is a ${x.en}.`}}));
  const v = VOCAB.filter(x=>(S.cats||DEFAULT_CATS).includes(x.cat)).map(x=>({...x,kind:"vocab",ex:frameFor(x)}));
  const n = notebook.filter(x=>x.review && x.bandari).map(x=>({id:"n_"+x.id,kind:"south",fa:x.bandari,tr:x.standard||"",en:x.en||"",note:(x.verified?"Checked with a native speaker":"Not yet checked")+(x.source?" · "+x.source:""),audio:x.audio}));
  return [...c,...n,...w,...v];
}
const groupOf = c => (c.kind==="chunk"||c.kind==="south") ? "talk" : "words";
function frameFor(x, k){
  const fr = FRAMES[x.cat]; if(!fr) return null;
  const f = fr[(k ?? x.id.length + x.fa.length) % fr.length];
  const tr = /[aeiouâ]$/.test(x.tr) ? f[1].replace("___-am","___m") : f[1];
  return {fa:f[0].replace("___",x.fa), tr:tr.replace("___",x.tr), en:f[2].replace("___",x.en.split(" / ")[0])};
}
function dueQueue(filter, group){
  const d=today(), cards=allCards().filter(filter||(()=>true));
  const due = cards.filter(c=>S.cards[c.id] && S.cards[c.id].d<=d);
  const introduced = S.intro[d+"|"+group]||0;
  const fresh = cards.filter(c=>!S.cards[c.id]).slice(0, Math.max(0,S.newPerDay-introduced));

  g.clearRect(0,0,W,H); g.fillStyle=css.getPropertyValue("--line").trim(); g.font=`400 ${W*0.62}px Vazirmatn, Tahoma, sans-serif`; g.textAlign="center"; g.textBaseline="middle"; g.direction="rtl"; g.fillText(ch,W/2,H*0.48);
  const x=ink.getContext("2d"); x.clearRect(0,0,W,H); x.lineCap="round"; x.lineJoin="round"; x.lineWidth=Math.max(6,W/38); x.strokeStyle=css.getPropertyValue("--accent").trim();
  let down=false;
  const pt=e=>{const b=ink.getBoundingClientRect(); return [e.clientX-b.left,e.clientY-b.top];};
  ink.onpointerdown=e=>{down=true; ink.setPointerCapture(e.pointerId); const [a,b]=pt(e); x.beginPath(); x.moveTo(a,b);};
  ink.onpointermove=e=>{ if(!down) return; const [a,b]=pt(e); x.lineTo(a,b); x.stroke(); };
  ink.onpointerup=ink.onpointercancel=()=>{down=false;};
}

/* ---------- Type ---------- */
let typeLevel=0;
function viewType(){
  const lv=LEVELS[typeLevel];
  const words = [...new Set([...CHUNKS,...WORDS].flatMap(c=>c.fa.replace(/[.،؟?…!/]/g," ").split(/\s+/)).filter(w=>w && !w.includes("‌") && !w.includes("ـ")))];
  const make=()=> lv.keys ? Array.from({length:8},()=>Array.from({length:3},()=>lv.keys[Math.floor(Math.random()*lv.keys.length)]).join("")).join(" ")
                          : shuffle(words).slice(0,8).join(" ");
  let target=[...make()], pos=0, errs=0, start=0, errAt=new Set();
  const line=h("div",{class:"line",lang:"fa","aria-live":"polite"}); const stats=h("div",{class:"row"});
  const kb=h("div",{class:"kb","aria-hidden":"true"},...KBROWS.map(row=>h("div",{class:"kr"},...row.map(code=>h("div",{class:"k"+(["KeyA","KeyS","KeyD","KeyF","KeyJ","KeyK","KeyL","Semicolon"].includes(code)?" home":""),"data-code":code},h("span",{class:"lat"},LATLABEL(code)),h("span",{class:"per"},KEYMAP[code]+(SHIFTMAP[code]?" "+SHIFTMAP[code]:"")))))));
  const cap=h("input",{class:"capture",id:"type-cap",type:"text",autocomplete:"off",autocapitalize:"off",spellcheck:"false","aria-label":"Typing input"});
  function paint(){
    line.replaceChildren(...target.map((c,i)=>h("span",{class:i<pos?(errAt.has(i)?"err":"ok"):i===pos?"cur":""},c===" "?" ":c)));
    const want=target[pos];
    kb.querySelectorAll(".k").forEach(k=>{ const code=k.dataset.code; k.classList.toggle("hot", want && (KEYMAP[code]===want || SHIFTMAP[code]===want)); });
    const mins=start?(Date.now()-start)/6e4:0; const cpm=mins>0?Math.round(pos/mins):0; const acc=pos?Math.round((1-errs/(pos+errs))*100):100;
    stats.replaceChildren(h("div",{class:"stat"},h("b",{},cpm),h("span",{},"characters / min")),h("div",{class:"stat"},h("b",{},acc+"%"),h("span",{},"accuracy")),h("div",{class:"stat"},h("b",{},S.typing[typeLevel]||"–"),h("span",{},"your best here")));
    if(want===undefined){ const best=S.typing[typeLevel]||0; if(acc>=90 && cpm>best){ S.typing[typeLevel]=cpm; save(); toast("New best"); } line.append(h("div",{style:"font-family:var(--f-body);font-size:16px;letter-spacing:0;margin-top:8px"},acc>=90?"Line done. Press Enter for another.":"Line done. Get accuracy over 90% to count a best. Press Enter.")); }
  }
  function press(ch){
    if(target[pos]===undefined) return;
    if(!start) start=Date.now();
    if(ch===target[pos] || (target[pos]==="ی" && ch==="ي") || (target[pos]==="ک" && ch==="ك")){ pos++; } else { errs++; errAt.add(pos); }
    paint();
  }
  const reset=()=>{ target=[...make()]; pos=0; errs=0; start=0; errAt=new Set(); paint(); };
  function onKey(e){
    if(document.activeElement && document.activeElement!==cap && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
    if(e.ctrlKey||e.metaKey||e.altKey) return;
    if(e.key==="Enter"){ e.preventDefault(); reset(); return; }
    const m = e.shiftKey ? (SHIFTMAP[e.code]||null) : KEYMAP[e.code];
    if(e.key && /[؀-ۿ‌]/.test(e.key)){ e.preventDefault(); press(e.key); return; }   // OS already set to Persian
    if(m){ e.preventDefault(); press(m); }                                                          // physical key → standard layout
  }
  cap.addEventListener("input",()=>{ // phones: keydown is often "Unidentified"; read what the keyboard inserted
    for(const ch of cap.value){ const code=LATIN[ch.toLowerCase()]; press(/[؀-ۿ‌ ]/.test(ch)?ch:(code?KEYMAP[code]:ch)); }
    cap.value="";
  });
  document.addEventListener("keydown",onKey); cleanup=()=>document.removeEventListener("keydown",onKey);
  paint();
  return h("div",{class:"view"},
    h("div",{},h("h3",{},"Type · Persian standard keyboard"),h("h1",{},"Touch-type Persian on your normal keyboard")),
    h("p",{class:"lede"},"No settings to change. Each key you press is mapped to the Windows Persian (Standard) layout, ISIRI 9147, shown below. Keep your fingers on the home row, the keys with the teal underline. On a phone, switch to a Persian keyboard and tap the line to type."),
    h("div",{class:"row"},...LEVELS.map((l,i)=>h("button",{class:i===typeLevel?"primary":"",onclick:()=>{typeLevel=i;render();}},`${i+1}. ${l.name}`))),
    h("div",{onclick:()=>cap.focus()},line,cap), stats, kb,
    h("div",{class:"row"},h("button",{onclick:reset},"New line (Enter)")),
    h("p",{style:"color:var(--muted);font-size:14px"},"Shift + C gives ",fa("ژ"),", Shift + H gives ",fa("آ"),", and Shift + Space gives the half-space used in words like ",fa("می‌فهمم"),". Mac and Android Persian layouts differ slightly from this one, so check yours before you rely on muscle memory."));
}

  return h("div",{class:"view"},
    h("div",{},h("h3",{},"South · the Gulf coast of Hormozgan"),h("h1",{},"Your Bandari notebook")),
    h("p",{class:"lede"},"Afro-Iranian communities live along the Persian Gulf and the Gulf of Oman: Hormozgan (Bandar Abbas, Qeshm, Hormuz, Minab), Bushehr, Sistan-Baluchestan, Khuzestan and southern Fars. In each place they speak the local language of that place. There is no single Afro-Iranian dialect. So choosing how you sound means choosing a place."),
    targetPanel(),

/* ---------- Why ---------- */
function viewWhy(){
  const C=(t,p,c)=>h("div",{class:"claim"},h("b",{},t),h("div",{},h("p",{},p),h("cite",{},c)));
  return h("div",{class:"view"},
    h("div",{},h("h3",{},"The research behind each screen"),h("h1",{},"Why it works")),
    h("p",{class:"lede"},"Each design choice in the app traces back to research on second-language learning. Where the evidence is weaker, or where an app cannot do the job, this page says so."),
    h("div",{class:"panel"},
      C("Four strands","A balanced course splits time roughly evenly between meaning-focused input, meaning-focused output, deliberate study of the language, and fluency practice. Today's session is built on this.","Nation, I.S.P. (2007). The four strands. Innovation in Language Learning and Teaching, 1(1), 2–13."),
      C("Chunks first","Fluent speech relies heavily on ready-made, memorised phrases. Learning whole chunks early gives you real conversation before you know the grammar, and the chunks are later broken down into patterns.","Wray, A. (2002). Formulaic Language and the Lexicon. Cambridge UP; Myles, Hooper & Mitchell (1998), Language Learning 48(3)."),
      C("Recall, spaced out","Retrieving an answer beats rereading it, and spacing reviews over days beats massing them, especially on delayed tests. Hence say-it-first cards and growing intervals.","Karpicke & Roediger (2008), Science 319; Kim & Webb (2022), Language Learning 72(1), meta-analysis of spaced practice in L2 learning."),
      C("Frequent words first","In spoken English, about 2,000 word families cover roughly 95% of the words in everyday conversation. A small, well-chosen core gets you a long way. This app's list is hand-picked for getting around. The next step is checking it against a Persian frequency dictionary.","Adolphs & Schmitt (2003), Applied Linguistics 24(4); Nation (2006), Canadian Modern Language Review 63(1); Miller & Aghajanian-Stewart (2017), A Frequency Dictionary of Persian, Routledge."),
      C("Cognates","Words shared with a language you already know are learned faster and forgotten less. For an Arabic speaker, Arabic loanwords in Persian are a real shortcut, as long as you watch for meaning shifts.","de Groot & Keijzer (2000), Language Learning 50(1); Perry, 'Arabic elements in Persian', Encyclopaedia Iranica."),
      C("Explicit study helps","Directly studying form (letters, endings like -e for 'is') produces large, lasting gains alongside exposure.","Norris & Ortega (2000), Language Learning 50(3); Spada & Tomita (2010), Language Learning 60(2)."),
      C("Speaking with people","Conversation with feedback drives acquisition: you notice gaps when you are corrected. An app can't supply this, so a tutor session is part of the plan.","Mackey & Goo (2007), meta-analysis in Conversational Interaction in SLA (Oxford UP); Lyster & Saito (2010), SSLA 32(2), corrective feedback."),
      C("Accent, realistically","Pronunciation instruction works. Perception training with many different voices improves both hearing and producing new sounds. Adults rarely reach a fully native accent, but accent, intelligibility and ease of understanding are separate things, so you can sound clearly southern and be easy to follow.","Lee, Jang & Plonsky (2015), Applied Linguistics 36(3); Uchihara, Karas & Thomson (2024), Applied Psycholinguistics, HVPT meta-analysis; Munro & Derwing (1995), Language Learning 45(1); Flege & Bohn (2021), SLM-r."),
      C("Handwriting","Adults learning new characters recognised them better after handwriting them than after typing them. That is why Letters comes before Type.","Longcamp et al. (2008), Journal of Cognitive Neuroscience 20(5)."),
      C("Time","The US Foreign Service Institute rates Persian at about 44 weeks, roughly 1,100 class hours, to professional working proficiency for English speakers. Daily practice over months matters more than intense bursts.","FSI language difficulty rankings, U.S. Department of State.")),
    h("div",{class:"panel"},h("h2",{},"What the app cannot do"),
      h("p",{},"The built-in voice is synthetic Tehran-style speech, at best. It is a scaffold for reading, not a model for your accent. Your accent will come from the people you listen to and talk with, so the most valuable hour of your week is a conversation with a speaker from the coast.")),
    h("div",{class:"panel"},h("h2",{},"On Afro-Iranians and Bandari"),
