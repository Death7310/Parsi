name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Export items and check pronunciation spellings
        run: |
          pip install piper-tts==1.8.0
          node scripts/export-items.mjs
          python scripts/check_pronunciation.py
      - name: Cache voices and generated audio
        uses: actions/cache@v4
        with:
          path: |
            .voices
            audio/tts
          key: tts-${{ hashFiles('audio/items.json', 'audio/say-overrides.json') }}
          restore-keys: tts-
      - name: Generate synthetic audio
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python scripts/make_tts.py
      - run: npm run android
      - run: ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: khalij-farsi-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: generated-audio
          path: |
            audio/tts
            audio/manifest.json
